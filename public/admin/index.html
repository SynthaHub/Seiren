<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Seiran Partners</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
    </style>
    <!--
      Netlify Identity widget — handles email/password login for the site
      owner. Points at the gateway site (see netlify-identity-gateway/), not
      at this domain, since Identity isn't hosted here.
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.reload();
            });
          }
        });
      }
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
