            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
          - label: "Purpose / Vision / Mission (exactly 3, in this order)"
            name: "foundations"
            widget: list
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "\"Who we work with\""
            name: "whoWeWorkWith"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - { label: "Label above the sector list", name: "experienceLabel", widget: string, required: true }
          - label: "Sectors list"
            name: "sectors"
            widget: list
          - label: "Closing call to action"
            name: "cta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }

  - name: "page_approach"
    label: "🧭 Approach Page"
    description: "The /approach page's hero, section headings and closing quote. The seven stages themselves are edited under \"🪜 Transformation Journey\"."
    files:
      - name: "approach"
        label: "Approach Page"
        file: "content/pages/approach.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - label: "\"Stage by stage\" section heading"
