                widget: string
                required: false
          - label: "Office Address"
            name: "officeAddress"
            widget: object
            collapsed: true
            fields:
              - { label: "Name", name: "name", widget: string, required: true }
              - { label: "Street", name: "street", widget: string, required: true }
              - { label: "Locality", name: "locality", widget: string, required: true }
              - { label: "Country", name: "country", widget: string, required: true }
