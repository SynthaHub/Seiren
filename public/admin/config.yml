# Decap CMS configuration for the Seiran Partners site.
#
# Every collection below maps straight onto a file under content/ that
# src/content/*.ts loads at build time. Field names must match those files
# exactly — see the loader in the matching src/content/*.ts for the shape,
# and src/content/schemas.ts for the validation rules the CI pipeline
# enforces on every save (npm run validate-content).
#
# Login is email + password (or Google/Microsoft), not GitHub — the owner
# never sees GitHub. Handled by DecapBridge (decapbridge.com), a hosted
# replacement for Netlify Identity + Git Gateway purpose-built for Decap CMS.
#
# Collections are ordered to roughly match the site's own navigation, and
# labelled with an emoji since Decap has no real sidebar grouping — this is
# the closest thing to visual organisation the list supports.
#
# site_url / display_url point at the test domain for now — swap to the
# real production domain before launch (see README.md's "Before launch").
# If that happens, also update the CMS login URL in the DecapBridge
# dashboard for this site to match.

backend:
  name: git-gateway
  repo: SynthaHub/Seiren
  branch: main
  identity_url: https://auth.decapbridge.com/sites/e341094d-d64c-43e7-8df4-d078df284740
  gateway_url: https://gateway.decapbridge.com

  # Attributes each change to the person who made it — useful once there's
  # more than one editor.
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Every edit becomes a draft the owner reviews before it goes live, rather
# than publishing straight to `main` (and triggering a deploy) on save.
publish_mode: editorial_workflow

media_folder: "public/placeholders"
public_folder: "/placeholders"

site_url: https://tell.sazara.co.ke
display_url: https://tell.sazara.co.ke

collections:
  - name: "page_home"
    label: "🏠 Home Page"
    description: "Every section of the home page — hero, intro, pillars, process, contact, insights preview."
    files:
      - name: "home"
        label: "Home Page"
        file: "content/pages/home.json"
        format: json
        fields:
          - label: "Hero (top banner)"
            name: "hero"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow (small label above the heading)", name: "eyebrow", widget: string, required: true }
              - label: "Heading — accented word (rendered in gold)"
                name: "headingAccent"
                widget: string
                required: true
              - { label: "Heading — rest of line 1", name: "headingLine1", widget: string, required: true }
              - { label: "Heading — line 2", name: "headingLine2", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - { label: "Primary button label", name: "primaryCtaLabel", widget: string, required: true }
              - label: "Primary button link — developer only"
                name: "primaryCtaHref"
                widget: string
                required: true
              - { label: "Secondary link label", name: "secondaryCtaLabel", widget: string, required: true }
              - label: "Secondary link target — developer only"
                name: "secondaryCtaHref"
                widget: string
                required: true
              - { label: "Stat number", name: "statNumber", widget: string, required: true }
              - { label: "Stat unit label", name: "statLabel", widget: string, required: true }
              - { label: "Stat card title", name: "statTitle", widget: string, required: true }
              - { label: "Stat card caption", name: "statCaption", widget: string, required: true }
          - label: "About / why growth gets harder"
            name: "about"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - label: "Checklist (3 items)"
                name: "differentiators"
                widget: list
              - { label: "Button label", name: "ctaLabel", widget: string, required: true }
              - label: "Figure labels (the numbers themselves are computed automatically and can't be edited here)"
                name: "figureLabels"
                widget: object
                collapsed: true
                fields:
                  - { label: "Pillars figure label", name: "pillars", widget: string, required: true }
                  - { label: "Services figure label", name: "services", widget: string, required: true }
                  - { label: "Stages figure label", name: "stages", widget: string, required: true }
                  - { label: "Lead consultant figure label", name: "leadConsultant", widget: string, required: true }
          - label: "Capability ticker (the scrolling navy strip)"
            name: "capabilityTicker"
            widget: object
            collapsed: true
            fields:
              - label: "Words (order matters — they scroll in this order)"
                name: "words"
                widget: list
              - { label: "Screen-reader heading (not visible)", name: "srHeading", widget: string, required: true }
          - label: "Pillars intro"
            name: "pillars"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - label: "Card link label (e.g. \"Discover more\")"
                name: "cardCtaLabel"
                widget: string
                required: true
          - label: "Process intro (\"Seven stages\")"
            name: "process"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - { label: "Button label", name: "ctaLabel", widget: string, required: true }
          - label: "Get in touch"
            name: "getInTouch"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - { label: "\"Where we are\" label", name: "labelWhereWeAre", widget: string, required: true }
              - { label: "\"Email us\" label", name: "labelEmailUs", widget: string, required: true }
              - { label: "\"Phone\" label", name: "labelPhone", widget: string, required: true }
              - { label: "Form card heading", name: "cardHeading", widget: string, required: true }
              - { label: "Form card subcopy", name: "cardSubcopy", widget: string, required: true }
          - label: "Insights preview"
            name: "insightsPreview"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Link label", name: "ctaLabel", widget: string, required: true }
              - label: "Featured post"
                name: "featured"
                widget: object
                collapsed: true
                fields:
                  - { label: "Title", name: "title", widget: string, required: true }
                  - { label: "Excerpt", name: "excerpt", widget: text, required: true }
                  - { label: "Category tag", name: "category", widget: string, required: true }
              - label: "Other posts (exactly 3 — each one's photo is fixed in code by position, so don't add or remove rows)"
                name: "posts"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Title", name: "title", widget: string, required: true }
                  - { label: "Category tag", name: "category", widget: string, required: true }
              - { label: "\"Forthcoming\" pill text", name: "forthcomingLabel", widget: string, required: true }
              - { label: "Author name", name: "authorName", widget: string, required: true }

  - name: "page_about"
    label: "ℹ️ About Page"
    description: "The /about page — the Seiran name story, purpose/vision/mission, who we work with."
    files:
      - name: "about"
        label: "About Page"
        file: "content/pages/about.json"
        format: json
        fields:
