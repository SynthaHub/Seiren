            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
          - label: "Closing quote section"
            name: "quoteSection"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Quote", name: "quote", widget: text, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "Closing call to action"
            name: "cta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }

  - name: "journey"
    label: "🪜 Transformation Journey"
    description: "The seven stages, in order — used on the home page (first four) and the Approach page (all seven)."
    files:
      - name: "journey"
        label: "Journey Stages"
        file: "content/journey.json"
        format: json
        fields:
          - label: "Stages — order matters, this is the one place on the site where numbering is real"
            name: "stages"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: string, required: true }
              - { label: "Description", name: "description", widget: text, required: true }

  - name: "page_services"
    label: "🧩 Services Pages"
    description: "Hero, intro and CTA text shared by /services and each pillar's detail page. Pillar names/services themselves are under \"🛠️ Service Pillars\"."
    files:
      - name: "services"
        label: "Services Pages"
        file: "content/pages/services.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - { label: "\"Explore\" link prefix (e.g. \"Explore Strategy & Growth\")", name: "exploreLabel", widget: string, required: true }
          - label: "Quote section"
            name: "quoteSection"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Quote", name: "quote", widget: text, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "Closing call to action"
            name: "cta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "Pillar detail page (the \"/services/$pillar\" pages)"
            name: "pillarPage"
            widget: object
            collapsed: true
            fields:
              - { label: "Hero eyebrow", name: "heroEyebrow", widget: string, required: true }
              - { label: "\"The full list\" eyebrow", name: "fullListEyebrow", widget: string, required: true }
              - label: "Heading template — keep {n} and {title} exactly as shown, they're replaced automatically"
                name: "fullListHeadingTemplate"
                widget: string
                required: true
              - { label: "\"The other three\" eyebrow", name: "otherPillarsEyebrow", widget: string, required: true }
              - { label: "\"Often part of the solution\" heading", name: "otherPillarsHeading", widget: string, required: true }
              - { label: "\"Explore\" link label", name: "exploreLabel", widget: string, required: true }
              - label: "CTA heading template — keep {pillar} exactly as shown"
                name: "ctaHeadingTemplate"
                widget: string
                required: true
              - { label: "CTA body", name: "ctaBody", widget: text, required: true }

  - name: "services"
    label: "🛠️ Service Pillars"
    description: "The four advisory pillars and their named services — feeds /services, each pillar page, and the home page pillars section."
    files:
      - name: "services"
        label: "Service Pillars"
        file: "content/services.json"
        format: json
        fields:
          - label: "Pillars"
            name: "pillars"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - label: "Slug (URL — changing this breaks the page link, check with a developer first)"
                name: "slug"
                widget: string
                required: true
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Summary", name: "summary", widget: text, required: true }
              - label: "Services"
                name: "services"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: "Name", name: "name", widget: string, required: true }
                  - label: "Question (must end with a question mark — this is what makes the list persuasive, not jargon)"
                    name: "question"
                    widget: string
                    required: true
                    pattern: ["\\?$", "Must end with a question mark"]

  - name: "page_team"
    label: "👤 Team Page"
    description: "The /team page — founder bio, credentials, and the strategic associates section."
    files:
      - name: "team"
        label: "Team Page"
        file: "content/pages/team.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - label: "Founder"
            name: "founder"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow label", name: "eyebrowLabel", widget: string, required: true }
              - { label: "Name", name: "name", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Bio — paragraph 1", name: "bioParagraph1", widget: text, required: true }
              - { label: "Bio — paragraph 2", name: "bioParagraph2", widget: text, required: true }
              - { label: "LinkedIn button label", name: "linkedInLabel", widget: string, required: true }
          - label: "Checklist (3 items)"
            name: "differentiators"
            widget: list
          - label: "Strategic associates section"
            name: "associates"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Intro", name: "intro", widget: text, required: true }
              - label: "Areas of expertise"
                name: "areas"
                widget: list
              - { label: "Closing paragraph", name: "closing", widget: text, required: true }
          - label: "Closing call to action"
            name: "cta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }

  - name: "page_case_studies"
    label: "📁 Case Studies Page"
    description: "The /case-studies page's hero, notice banner and section text. The scenarios themselves are under \"📚 Case Studies\"."
    files:
      - name: "case-studies"
        label: "Case Studies Page"
        file: "content/pages/case-studies.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - label: "Notice banner (the illustrative-scenarios disclaimer)"
            name: "noticeBanner"
            widget: object
            collapsed: true
            hint: >-
              This renders as: [Bold lead] [Body intro] "Seiran has published
              <N> real case studies" [Permission note] — the middle clause
              with the actual count is generated automatically, so bodyIntro
              should end right before it and permissionNote should start
              right after "studies".
            fields:
              - { label: "Bold lead sentence", name: "boldLead", widget: string, required: true }
              - { label: "Body intro (ends right before the auto-generated count)", name: "bodyIntro", widget: text, required: true }
              - { label: "Permission note (starts right after the auto-generated count)", name: "permissionNote", widget: text, required: true }
          - label: "\"Every case study follows the same six parts\""
            name: "methodSection"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Intro", name: "intro", widget: text, required: true }
          - label: "Confidentiality section"
            name: "confidentialitySection"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Quote", name: "quote", widget: text, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "Closing call to action"
            name: "cta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }

  - name: "case_studies"
    label: "📚 Case Studies"
    description: "Illustrative scenarios and (once permitted) real client engagements. See the hint on \"Illustrative?\" before adding a real one."
    folder: "content/case-studies"
    create: true
    identifier_field: slug
    format: json
    extension: json
    summary: "{{title}} ({{sector}})"
    fields:
      - label: "Slug (URL-safe, unique — do not change once published)"
        name: "slug"
        widget: string
        required: true
      - { label: "Title", name: "title", widget: string, required: true }
      - { label: "Sector", name: "sector", widget: string, required: true }
      - label: "Illustrative? (a worked example, NOT a real client)"
        name: "illustrative"
        widget: boolean
        default: true
        hint: >-
          Leave this ON unless this is a real client engagement, cleared for
          publication. Illustrative entries must never name a real
          organisation and must never state a numeric outcome (e.g. "revenue
          up 40%") — describe what changed structurally instead.
      - label: "Published with the client's explicit permission?"
        name: "publishedWithPermission"
        widget: boolean
        default: false
        required: false
        hint: >-
          Only relevant when "Illustrative?" above is OFF. A real case study
          cannot go live without this checked — the build pipeline rejects
          it otherwise, regardless of this checkbox.
      - { label: "Context", name: "context", widget: text, required: true }
      - { label: "Challenge", name: "challenge", widget: text, required: true }
      - { label: "Diagnosis", name: "diagnosis", widget: text, required: true }
      - { label: "Intervention", name: "intervention", widget: text, required: true }
      - { label: "Outcome", name: "outcome", widget: text, required: true }
      - { label: "Learning", name: "learning", widget: text, required: true }

  - name: "page_insights"
    label: "📰 Insights Page"
    description: "The /insights page — hero, the forthcoming article list, and the newsletter/closing sections."
    files:
      - name: "insights"
        label: "Insights Page"
        file: "content/pages/insights.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - label: "Forthcoming articles (the editorial seed list)"
            name: "forthcoming"
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: "Title (used as the eventual page's heading)", name: "title", widget: string, required: true }
              - { label: "Excerpt", name: "excerpt", widget: text, required: true }
              - { label: "Category tag", name: "category", widget: string, required: true }
          - label: "\"First to be published\" section"
            name: "firstPublishedSection"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Intro", name: "intro", widget: text, required: true }
          - { label: "\"Tell me when these are published\" link label", name: "notifyLinkLabel", widget: string, required: true }
          - label: "Newsletter section"
            name: "notifySection"
            widget: object
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
          - label: "Closing call to action"
            name: "finalCta"
            widget: object
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - { label: "Body", name: "body", widget: text, required: true }
              - { label: "Button label", name: "ctaLabel", widget: string, required: true }

  - name: "page_contact"
    label: "✉️ Contact Page"
    description: "The /contact page's hero, \"what happens next\" steps, and FAQ section heading. The enquiry form itself and the FAQ answers are edited elsewhere (❓ FAQs) — form field labels stay developer-only since they're tied to validation."
    files:
      - name: "contact"
        label: "Contact Page"
        file: "content/pages/contact.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Title", name: "title", widget: string, required: true }
              - { label: "Lede", name: "lede", widget: text, required: true }
          - label: "\"What happens next\" steps (exactly 4, in order)"
            name: "nextSteps"
            widget: list
          - { label: "Contact panel heading", name: "panelHeading", widget: string, required: true }
          - { label: "\"What happens next\" panel heading", name: "whatHappensNextHeading", widget: string, required: true }
          - label: "FAQ section heading"
            name: "faqSection"
            widget: object
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: string, required: true }
              - { label: "Heading", name: "heading", widget: string, required: true }

  - name: "faqs"
    label: "❓ FAQs"
    description: "Eleven questions and answers shown on the Contact page and emitted as FAQPage structured data for search results."
    files:
      - name: "faqs"
        label: "Frequently Asked Questions"
        file: "content/faqs.json"
        format: json
        fields:
          - label: "Questions"
            name: "faqs"
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: string, required: true }
              - { label: "Answer", name: "answer", widget: text, required: true }

  - name: "navigation"
    label: "🔗 Navigation & Contact"
    description: "Menu labels, office address, and every contact/social link on the site."
    files:
      - name: "navigation"
        label: "Site Navigation & Contact Details"
        file: "content/navigation.json"
        format: json
        fields:
          - label: "Primary Nav (menu labels only — do not change the links without a developer)"
            name: "primaryNav"
            widget: list
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: string, required: true }
              - { label: "Link — developer only", name: "to", widget: string, required: true }
          - label: "Footer Nav"
            name: "footerNav"
            widget: list
            collapsed: true
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: string, required: true }
              - label: "Items"
                name: "items"
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: string, required: true }
                  - { label: "Link — developer only", name: "to", widget: string, required: true }
          - label: "Contact Details"
            name: "contactDetails"
            widget: object
            collapsed: true
            fields:
              - { label: "Email", name: "email", widget: string, required: false }
              - label: "Telephone (local format, e.g. 0712345678 — the site derives the dial-out +254 form automatically)"
                name: "telephone"
                widget: string
                required: false
              - { label: "WhatsApp", name: "whatsapp", widget: string, required: false }
              - { label: "LinkedIn (Company)", name: "linkedInCompany", widget: string, required: false }
              - { label: "LinkedIn (Founder)", name: "linkedInFounder", widget: string, required: false }
              - { label: "Instagram", name: "instagram", widget: string, required: false }
              - { label: "TikTok", name: "tiktok", widget: string, required: false }
              - label: "Facebook (use the canonical facebook.com/<page> URL, not a share link with a tracking token)"
