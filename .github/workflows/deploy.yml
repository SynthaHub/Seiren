name: Validate, build and deploy

# Runs on every push to main — including the commits Decap CMS makes when the
# site owner publishes an edit at /admin. A failed validate-content or
# typecheck step stops here; nothing broken reaches HostAfrica.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"

      - run: npm ci

      - name: Validate content (content/*.json against src/content/schemas.ts)
        run: npm run validate-content

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Deploy to HostAfrica
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTAFRICA_FTP_HOST }}
          username: ${{ secrets.HOSTAFRICA_FTP_USERNAME }}
          password: ${{ secrets.HOSTAFRICA_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/client/
          server-dir: ${{ secrets.HOSTAFRICA_FTP_TARGET_DIR }}
